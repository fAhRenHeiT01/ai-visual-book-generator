[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-book-generator-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.12.4",
    "pydantic-settings==2.12.0",
    "PyYAML==6.0.3",
    "fastapi==0.121.1",
    "uvicorn==0.38.0",
    "httpx==0.28.1",
    "langgraph==1.0.3",
    "langgraph-checkpoint-sqlite==3.0.0",
    "aiosqlite==0.21.0",
    "SQLAlchemy==2.0.44",
    "Pillow==12.0.0",
    "python-multipart==0.0.20",
    "playwright==1.56.0",
    "pypdf==6.3.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "coverage==7.11.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bookgen*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["src/bookgen"]

[tool.coverage.report]
show_missing = true
