text: |
  Create option_a with strategy editorial_visual: emphasize narrative pacing and
  visual hierarchy. Prefer editorial_asymmetric, top_media_narrative,
  guided_alternating, full_bleed_hero or minimalist_swiss when eligible.
  Use a different archetype family from the executive structured alternative.
  Use eligible_treatments.archetypes_a and emphasis_a as preferences, subject to
  page budgets, source roles, aspect ratios and rolling exclusions. Establish a
  focal heading or exact testimonial/evidence excerpt, supported by full pointers.
  Use the resolved direction's surface_a. Return named treatments, never geometry.
