version: "1.0"
text: |
  Create option_b with strategy executive_structured: prioritize scannability and
  clear grouping. Prefer two_col_executive, modular_cards, chart_focus_band,
  dashboard_split or safe_flow_fallback when eligible. Use a different archetype
  family from the editorial visual alternative.
  Use eligible_treatments.archetypes_b and emphasis_b as preferences, subject to
  page budgets and rolling exclusions. Give source headings and lists clear groups
  with a different hierarchy and archetype family from option_a. Use the resolved
  direction's surface_b and the same named treatment vocabulary as option_a.
  Use the configured section divider at real section_boundaries to separate source
  groups, quieter titles, and the configured focal surface for supported excerpts.
  Keep full source pointers alongside any callout. Do not insert decorative rules
  into undivided prose or create titles for sources that have none. Write a rationale
  about this option's actual grouping, divider, list and protected media choices;
  explain plain source flow when richer treatments have no supporting content.
