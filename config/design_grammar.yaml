# These eight slot IDs are shared with the renderer. Null capacities explicitly
# require a renderer that reflows its content, rather than clipping a fixed grid.
density_scales: [airy, normal, compact]
object_fits: [contain, cover]
protected_asset_kinds: [chart, diagram]
protected_object_fit: contain
forbid_protected_overlay: true
body_component_types: [heading, body_prose, bullet_list, caption]
excerpt_component_types: [pull_quote, stat_callout]
slot_role_components:
  text: [heading, body_prose, bullet_list, pull_quote, stat_callout, caption, divider_rule]
  media: [image_frame]
  mixed: [heading, body_prose, bullet_list, pull_quote, stat_callout, caption, image_frame, divider_rule]
  decoration: [divider_rule]
fallback_density: compact
# Five unbounded families guarantee a dense pair after any three exclusions.
fallback_order: [safe_flow_fallback, two_col_executive, editorial_asymmetric,
                 top_media_narrative, guided_alternating, modular_cards,
                 minimalist_swiss, chart_focus_band, dashboard_split]

full_bleed_hero:
  family: hero
  renderer_shape: full_page
  max_words: 45
  max_images: 1
  reflow: false
  column_count: 1
  fallback_body_slot: body
  fallback_media_slot: media_main
  slots:
    header: {role: text, max_chars: 160, allows_overlay: false}
    body: {role: text, max_chars: 350, allows_overlay: false}
    media_main: {role: mixed, max_chars: 350, allows_overlay: true}
    callout: {role: text, max_chars: 180, allows_overlay: false}
    footer: {role: text, max_chars: 100, allows_overlay: false}
