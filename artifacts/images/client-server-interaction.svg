<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Client and server interaction</title>
  <desc id="desc">The author uses the Next.js studio to send page input to FastAPI. FastAPI calls the LangGraph workflow, LLM provider and local persistence. Two layouts return for selection. The selected page can be exported through Playwright.</desc>
  <defs>
    <style>.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#c9d5e6;stroke-width:2}.blue{fill:#e9f2ff;stroke:#6997ce;stroke-width:2}.green{fill:#eaf7ef;stroke:#72b28a;stroke-width:2}.ink{fill:#17263d;font:600 19px Arial,sans-serif}.small{fill:#465a72;font:15px Arial,sans-serif}.label{fill:#344962;font:14px Arial,sans-serif}.line{fill:none;stroke:#6683a6;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#9b82b8;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#6683a6" stroke-width="1.8"/></marker>
  </defs>
  <rect class="bg" width="1200" height="430" rx="18"/>
  <text class="ink" x="40" y="43">Current page generation and export</text>
  <rect class="blue" x="40" y="90" width="222" height="142" rx="13"/>
  <text class="ink" x="60" y="125">Author / Next.js</text><text class="small" x="60" y="155">Page text + images</text><text class="small" x="60" y="180">A/B preview + selection</text><text class="small" x="60" y="205">Book and PDF view</text>
  <rect class="box" x="349" y="90" width="223" height="142" rx="13"/>
  <text class="ink" x="369" y="125">FastAPI</text><text class="small" x="369" y="155">Sessions and assets</text><text class="small" x="369" y="180">Typed layout response</text><text class="small" x="369" y="205">Export request</text>
  <rect class="green" x="659" y="90" width="222" height="142" rx="13"/>
  <text class="ink" x="679" y="125">LangGraph</text><text class="small" x="679" y="155">Profile → A/B → validate</text><text class="small" x="679" y="180">Review checkpoint</text><text class="small" x="679" y="205">Commit selected page</text>
  <rect class="box" x="969" y="72" width="190" height="72" rx="13"/><text class="ink" x="989" y="104">LLM provider</text><text class="small" x="989" y="127">Layout decisions</text>
  <rect class="box" x="969" y="180" width="190" height="72" rx="13"/><text class="ink" x="989" y="211">Local storage</text><text class="small" x="989" y="234">SQLite + assets</text>
  <path class="line" d="M262 142 H349"/><text class="label" x="271" y="129">REST</text>
  <path class="line" d="M572 142 H659"/><text class="label" x="579" y="129">invoke</text>
  <path class="line" d="M881 122 L969 108"/><path class="line" d="M881 197 L969 216"/>
  <path class="dash" d="M659 211 L572 211"/><path class="dash" d="M349 211 L262 211"/><text class="label" x="277" y="255">Two validated options → author selection</text>
  <rect class="box" x="349" y="315" width="532" height="75" rx="13"/><text class="ink" x="371" y="345">PDF export: Playwright + page-count check</text><text class="small" x="371" y="370">Renders the book through the Next.js print route</text>
  <path class="line" d="M461 232 V315"/><path class="dash" d="M349 353 H152 V232"/>
</svg>
